# Copy to config.toml. Any value can be overridden by an env var named
# AGENT_SIP_<SECTION>_<KEY>, e.g. AGENT_SIP_SIP_PORT=5080.

[sip]
local_ip = ""            # our IP as seen by the phone; empty = auto-detect
bind_host = "0.0.0.0"
port = 5060
rtp_port_min = 10000     # one even RTP port is allocated per call
rtp_port_max = 10100
local_user = "agent"     # user part of our SIP URI

# Known phones (repeat the table for more). Incoming calls from `ip` get
# call.phone = name; SipServer.originate("name") rings one.
[[phones]]
name = "socotel"
ip = "192.168.1.0"
port = 5060
user = "socotel"

[audio]
vad = "silero"          # "silero" (neural, installed by `make install`) or "energy" (RMS threshold)
speech_threshold = 500   # energy VAD: RMS (0-32767) above which a frame is "speech"
vad_threshold = 0.5      # silero VAD: speech probability above which a frame is "speech"
silero_model = "models/silero_vad.onnx"   # downloaded by `make install`
barge_in = true         # let the caller interrupt the agent while it is speaking
barge_in_min_speech = 0.3  # seconds of continuous speech needed to interrupt
silence_end = 1.5        # seconds of VAD silence after speech => end of turn
no_speech_timeout = 8.0  # give up if nothing is said within this time
max_record = 20.0        # hard limit in seconds
earcons = true           # waiting-feedback sounds (master switch)
earcon_volume = 0.25     # 0-1
beep = true              # short beep when the end of your input is detected
beep_freq = 800          # Hz
beep_duration = 0.12     # seconds
melody = true            # looping pattern while the agent is working
melody_delay = 0.4       # seconds to wait before the melody starts
melody_notes = "A4,E5"   # note names (A4=440Hz, F#4, Bb3), "-" = rest; range G2-G7
melody_note_duration = 0.3
melody_gap = 2.0         # silence between repetitions

[stt]                    # remote OpenAI-shaped speech-to-text
base_url = "http://localhost:8000/v1"
api_key = ""             # or AGENT_SIP_STT_API_KEY
model = "whisper-1"
language = ""            # empty = auto-detect
timeout = 30.0
extra = {}               # custom form fields, e.g. { temperature = 0.2, prompt = "..." }

[tts]                    # remote OpenAI-shaped text-to-speech
base_url = "http://localhost:8001/v1"
api_key = ""             # or AGENT_SIP_TTS_API_KEY
model = "tts-1"
voice = "alloy"
response_format = "wav"  # wav recommended; pcm needs pcm_sample_rate
pcm_sample_rate = 24000
timeout = 60.0
extra = {}               # custom JSON fields, e.g. { speed = 1.1 }

[llm]                    # remote OpenAI-shaped chat completions
base_url = "http://localhost:8002/api/v1"   # we POST to {base_url}/chat/completions
api_key = ""             # or AGENT_SIP_LLM_API_KEY
model = "gpt-4o-mini"
system_prompt_file = "prompts/system.md"    # edit this file to change the agent's behaviour
greeting = "Hello! How can I help?"         # spoken when the handset is lifted; "" = none
timeout = 60.0
extra = {}               # custom JSON fields, e.g. { temperature = 0.7, max_tokens = 200 }

[tools]                  # web tools; the LLM calls them on demand
tavily_api_key = ""      # or AGENT_SIP_TOOLS_TAVILY_API_KEY; empty = no web_search tool
tavily_base_url = "https://api.tavily.com"
search_max_results = 3
search_depth = "basic"   # "basic" or "advanced"
fetch_enabled = true     # fetch_url tool (public http/https only; private/LAN addresses blocked)
fetch_max_chars = 4000   # text returned to the LLM is truncated to this
fetch_max_bytes = 1000000
timeout = 15.0
