name: Deploy

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

# Publishing a GitHub Release deploys the tagged commit. The service is deployed by
# updating an existing checkout on the server to that exact commit, reinstalling the
# venv deps, and restarting the systemd unit.
#
# Server prerequisites (one-time):
#   - a clone of this repo at $DEPLOY_PATH (deploy key or https token), with
#     config.toml present (untracked, so deploys never touch it)
#   - make, curl and python3-venv available
#   - a systemd unit named `agent-sip` that runs $DEPLOY_PATH/.venv/bin/agent-sip
#   - passwordless sudo for `systemctl restart agent-sip`
#
# Required secrets: DEPLOY_USER, DEPLOY_HOST, DEPLOY_SSH_PRIVATE_KEY, DEPLOY_PATH
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Update checkout and install deps
        run: |
          ssh "$DEPLOY_TARGET" "
            set -e
            cd '$DEPLOY_PATH'
            git fetch --prune --tags origin
            git checkout --force '$DEPLOY_SHA'
            make install
          "

      - name: Restart service
        run: ssh "$DEPLOY_TARGET" "sudo systemctl restart agent-sip"
