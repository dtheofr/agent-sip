name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

# After CI succeeds on main, release only when __version__ is a new stable version.
# The release is created here (not via the release event) because a release created
# with GITHUB_TOKEN does not trigger another workflow run.
jobs:
  check:
    name: Check version
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check for a new stable version
        id: check
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          source = Path("src/agent_sip/__init__.py").read_text()
          match = re.search(r'^__version__ = "([^"]+)"$', source, re.MULTILINE)
          if match is None:
              raise SystemExit("could not read __version__")

          version = match.group(1)
          tag = f"v{version}"
          should_release = "false"

          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              print(f"{version} is not a stable release version; skipping")
          else:
              result = subprocess.run(
                  ["git", "ls-remote", "--tags", "origin", f"refs/tags/{tag}"],
                  check=True, capture_output=True, text=True,
              )
              if result.stdout.strip():
                  print(f"tag {tag} already exists; skipping")
              else:
                  changelog = Path("CHANGELOG.md").read_text()
                  if f"## [{version}]" not in changelog:
                      raise SystemExit(f"CHANGELOG.md has no section for [{version}]")
                  should_release = "true"
                  print(f"will release {tag}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"should_release={should_release}\n")
              out.write(f"version={version}\n")
              out.write(f"tag={tag}\n")
          PY

  build:
    name: Build and release
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify version matches the release tag
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path("src/agent_sip/__init__.py").read_text()
          match = re.search(r'^__version__ = "([^"]+)"$', source, re.MULTILINE)
          if match is None:
              raise SystemExit("could not read __version__")
          expected = f"v{match.group(1)}"
          if expected != os.environ["TAG"]:
              raise SystemExit(f"tag {os.environ['TAG']!r} does not match {expected!r}")
          PY

      - name: Build distribution
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Extract release notes
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          lines = Path("CHANGELOG.md").read_text().splitlines()
          start = next(
              (i + 1 for i, line in enumerate(lines) if line.startswith(f"## [{version}]")),
              None,
          )
          if start is None:
              raise SystemExit(f"CHANGELOG.md has no section for [{version}]")

          end = next(
              (i for i in range(start, len(lines)) if lines[i].startswith("## [")),
              len(lines),
          )
          notes = "\n".join(lines[start:end]).strip() or f"Release {version}."
          Path("release-notes.md").write_text(notes + "\n")
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$SHA" \
            --title "agent-sip $TAG" \
            --notes-file release-notes.md

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Server prerequisites (one-time):
      #   - a clone of this repo at $DEPLOY_PATH (deploy key or https token), with
      #     config.toml present (untracked, so deploys never touch it)
      #   - make, curl and python3-venv available
      #   - a systemd unit named `agent-sip` that runs $DEPLOY_PATH/.venv/bin/agent-sip
      #   - passwordless sudo for `systemctl restart agent-sip`
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Update checkout and install deps
        run: |
          ssh "$DEPLOY_TARGET" "
            set -e
            cd '$DEPLOY_PATH'
            git fetch --prune --tags origin
            git checkout --force '$DEPLOY_SHA'
            make install
          "

      - name: Restart service
        run: ssh "$DEPLOY_TARGET" "sudo systemctl restart agent-sip"
